#워크플로우 이름
name: deploy-product-dev

run-name: product-dev deploy by ${{ github.actor }} - ${{ github.run_number }}
on: 
  workflow_dispatch:
    inputs:
      branch:
        required: false
        default: 'deploy'
        type: string
        description: "빌드할 브랜치명"  
# develop 브랜치에 푸쉬 되었을 때 워크플로우가 실행됩니다.
# on:
#   push:
#     branches:
#       - develop # 해당 브랜치에 머지되면 이 워크플로우가 트리거 된다.

jobs:
  deploy:
    runs-on: ubuntu-latest

    # 변수 설정
    env:
      AWS_REGION: ap-northeast-2
      ECR_REPOSITORY: ecommerce-product
      ECS_SERVICE: ecommerce-service
      ECS_CLUSTER: ecommerce-cluster
      ECS_TASK_DEFINITION: ./product-dev-tdf.json # 실행할 TDF, 본인은 프로젝트 안에 tdf를 작성해두어서 경로를 이렇게 설정
      CONTAINER_NAME: ecommerce-product-was1

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      # AWS Config
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: install jdk 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission to Gradle wrapper
        run: |
          chmod +x gradlew

      - name: Build with Gradle (Skip Tests for Faster Build)
        run: |
          ./gradlew clean build -x test

      - name: Verify JAR File Exists
        run: |
          ls -lah product/build/libs/

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        
        # 프로젝트에 주입할 환경변수를 S3 버킷에서 가져와서 프로젝트에 주입
        # 가져와서 이름을 변경함
      - name: Download Environment File from S3 bucket
        run: |
          aws s3 cp s3://innercircle-ecommerce-environment-file/product-service-dev.env .
          mv ./product-service-dev.env ./product/.env

      #- name: Build, tag, and push image to Amazon ECR
      #  id: build-image
      #  env:
      #    ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      #    ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
      #    IMAGE_TAG: ${{ github.sha }}
      #  run: |
          # Build a docker container and
          # push it to ECR so that it can
          # be deployed to ECS.
          # 도커 빌드 명령어
          #docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG Dockerfile .
          #docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          #echo "::set-output name=image::$ECR_REGISTRY/$ECR_REPOSITORY_NAME:$IMAGE_TAG"

      - name: Login to AWS ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_URI }}

      - name: Build Docker Image
        id: build-image
        run: | 
          cd product
          docker build -t ${{ env.ECR_REPOSITORY }} .
          docker tag ${{ env.ECR_REPOSITORY }}:latest ${{ secrets.ECR_URI }}/${{ env.ECR_REPOSITORY }}:latest
          docker push ${{ secrets.ECR_URI }}/${{ env.ECR_REPOSITORY }}:latest
        #echo "${{ secrets.ECR_URI }}/${{ env.ECR_REPOSITORY }}:latest" >> $GITHUB_OUTPUT

      #- name: Push Docker Image to AWS ECR
      #  run: |
      #    docker tag ${{ env.ECR_REPOSITORY }}:latest ${{ secrets.ECR_URI }}/${{ env.ECR_REPOSITORY }}:latest

      #- name: Push Docker Image to AWS ECR
      #  run: |
      #    docker push ${{ secrets.ECR_URI }}/${{ env.ECR_REPOSITORY }}:latest

      - name: 최신 태스크 정의 가져오기
        id: task-def
        run: |
          aws ecs describe-task-definition --task-definition ${{ env.ECS_TASK_DEFINITION }} --query taskDefinition > task-definition.json
     
      - name: 새 태스크 정의 등록
        id: register-task-def
        run: |
          IMAGE_URI="${{ secrets.ECR_URI }}/${{ env.ECR_REPOSITORY }}:latest"
          NEW_TASK_DEF=$(jq --arg IMAGE_URI "$IMAGE_URI" '.containerDefinitions[0].image = $IMAGE_URI' task-definition.json)
          echo "$NEW_TASK_DEF" > task-definition.json
          TASK_REVISION=$(aws ecs register-task-definition --cli-input-json file://task-definition.json --query 'taskDefinition.revision')
          echo "TASK_REVISION=$TASK_REVISION" >> $GITHUB_ENV     
          
      # - name: Fill in the new image ID in the Amazon ECS task definition
      #   id: register-task-def
      #   uses: aws-actions/amazon-ecs-render-task-definition@v1
      #   with:
      #     task-definition: ${{ env.ECS_TASK_DEFINITION }}
      #     container-name: ${{ env.CONTAINER_NAME }}
      #     image: ${{ steps.build-image.outputs.image }}

      - name: ECS 서비스 업데이트
        run: |
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service ${{ secrets.ECS_SERVICE }} --task-definition ${{ env.ECS_TASK_DEFINITION }}:$TASK_REVISION --force-new-deployment
          
      # - name: Deploy Amazon ECS task definition
      #   uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      #   with:
      #     task-definition: ${{ steps.task-def.outputs.task-definition }}
          # service: ${{ env.ECS_SERVICE }}
          # cluster: ${{ env.ECS_CLUSTER }}
          # wait-for-service-stability: true
