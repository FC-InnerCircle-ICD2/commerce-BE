spring:
  application:
    name: order-service
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:ecommerce
    username: sa
    password:
product:
  find:
    feign-endpoint: localhost:8080
server:
  port: 9999
aws:
  s3:
    access-key: ${AWS_S3_ACCESS_KEY}
    secret-key: ${AWS_S3_SECRET_KEY}

