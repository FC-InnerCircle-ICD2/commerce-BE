spring:
  application:
    name: order-service
  jpa:
    hibernate:
      ddl-auto: validate
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DATASOURCE_RUL:jdbc:mysql://localhost:3306/emotional_cart}
    username: ${DATASOURCE_USERNAME:root}
    password: ${DATASOURCE_PASSWORD:1234}
  flyway:
    enabled: false
server:
  port: 9999
product:
  find:
    feign-endpoint: localhost:8080