spring:
  application:
    name: order-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DATASOURCE_RUL:jdbc:mysql://localhost:3306/emotional_cart}?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DATASOURCE_USERNAME:root}
    password: ${DATASOURCE_PASSWORD:1234}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.MySQLDialect
        generate_statistics: true
        id:
          new_generator_mappings: true
  flyway:
    enabled: false
server:
  port: 9999
product:
  find:
    feign-endpoint: ${PRODUCT_SERVER_URL:localhost}:8080
springdoc:
  swagger-ui:
    urls:
      - name: Order Service
        url: ${ORDER_SERVER_URL:http://localhost}:8080/v3/api-docs
      - name: Product Service
        url: ${PRODUCT_SERVER_URL:http://localhost}:8080/api/v3/api-docs
aws:
  s3:
    access-key: ${AWS_S3_ACCESS_KEY}
    secret-key: ${AWS_S3_SECRET_KEY}
