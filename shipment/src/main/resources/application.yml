spring:
  application:
    name: shipment-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DATASOURCE_RUL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.MySQLDialect
        generate_statistics: true
        id:
          new_generator_mappings: true
  flyway:
    enabled: false
server:
  port: 9999
product:
  find:
    feign-endpoint: ${PRODUCT_SERVER_URL:http://localhost}:8080
aws:
  s3:
    access-key: test
    secret-key: test
